{% set name = "rope" %}
{% set version = "1.15.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7ce304aa86350d9454533b6817d0c7c01301b0a4fad356d8372b5d77df35756f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - pytoolconfig >=1.2.2
    # pytoolconfig is required with its "global" extra upstream
    # (pytoolconfig >=1.2.2). The extra's backend changed: 1.2.x uses appdirs,
    # 1.3.x imports platformdirs, so both are needed for the allowed range.
    - appdirs >=1.4.4
    - platformdirs >=3.11.0
  run_constrained:
    - toml >=0.10.2
    - twine >=4.0.2
    - pip-tools >=6.12.1

test:
  imports:
    - rope
    - rope.base
    - rope.base.oi
    - rope.base.oi.type_hinting
    - rope.base.oi.type_hinting.providers
    - rope.base.oi.type_hinting.resolvers
    - rope.base.utils
    - rope.contrib
    - rope.contrib.autoimport
    - rope.refactor
    - rope.refactor.importutils
  requires:
    - pip
    - pytest >=7.0.1
    - pytest-timeout >=2.1.0
  source_files:
    - ropetest
  commands:
    - pip check
    - pytest -vv

about:
  home: https://github.com/python-rope/rope
  license_file: COPYING
  license: LGPL-3.0-or-later
  license_family: LGPL
  summary: A python refactoring library
  description: |
    Rope is the world's most advanced open source Python refactoring library (yes, I totally stole that tagline from Postgres).
  dev_url: https://github.com/python-rope/rope
  doc_url: https://rope.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - jjhelmus
